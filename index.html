<div id="modal" class="modal" onclick="if(event.target.id=='modal') closeModal()"><div class="modal-box"><img id="mImg" src=""><div style="padding:16px"><h3 id="mNom" style="margin:0 0 6px"></h3><div id="mDesc" style="font-size:12px;color:#666;margin-bottom:8px"></div><div id="mPrix" style="font-weight:800;color:#b80000;font-size:18px;margin-bottom:12px"></div><button id="mAdd" class="btn btn-pay" style="width:100%;margin:0">+ Ajouter</button><button onclick="closeModal()" style="width:100%;margin-top:8px;padding:12px;border:1px solid #ddd;background:#fff;border-radius:12px;font-weight:700">Fermer</button></div></div></div>

const REF='COPA'+Math.floor(Math.random()*9000+1000);

/*

1. Crée un dossier nommé "images" à côté de ce fichier HTML
2. Mets tes photos de Copacabana dedans avec ces noms exacts:
- pilon-poulet-braise.jpg

- demi-poulet-frit.jpg

- sifio-poisson.jpg

- omelette-copacabana.jpg
- paquet-saucisses.jpg
- spaghetti-saucisse.jpg

- akpan.jpg
- frites-aloco.jpg
- riz-gras.jpg
Si une image manque, ça affichera une image vide grise mais le menu marche quand même.
*/

const DATA=[
{c:"Viande Blanche",items:[
{n:"Pilon de poulet braisé avec frites et Aloco",p:3000,im:"images/pilon-poulet-braise.jpg",d:"Poulet braisé bien épicé servi avec frites croustillantes et Aloco"},
{n:"Cuisse de poulet",p:3250,im:"images/cuisse-poulet.jpg",d:"Cuisse tendre grillée ou frite"},

]},

]},
{c:"Les salades",items:[
{n:"Salade verte ou de choux",p:1500,im:"images/salade-verte.jpg",d:"Laitue - tomate - oignon - concombre - oeuf"},
{n:"Salade de pomme de terre",p:1500,im:"images/salade-pomme-terre.jpg"},

]},

{n:"Spaghetti aux oeuf",p:1000,im:"images/spaghetti-oeuf.jpg"},
{n:"Spaghetti Dosé",p:1500,im:"images/spaghetti-dose.jpg",d:"Oeuf + Saucisses"},

{n:"Spaghetti Gourmand",p:3000,im:"images/spaghetti-gourmand.jpg",d:"Viandes / Rognons / Saucisses / Oeuf"},
]},
{c:"Viande rouge",items:[

{n:"Viande sautée aux légumes",p:2000,im:"images/viande-legume.jpg"},

]},
{c:"Les accompagnements",items:[

{n:"Frites, Aloco, riz blanc, Attieke",p:1000,im:"images/frites-aloco.jpg"},
{n:"Riz au gras, Riz cantonnais, Pommes sautées",p:1500,im:"images/riz-gras.jpg"},
]}

let panier=[];function render(){let h='';DATA.forEach(cat=>{h+=`<div class="cat">${cat.c}</div>`;cat.items.forEach(it=>{h+=`<div class="item"><img src="${it.im}" onclick="openPlat('${it.n.replace(/'/g,"\\'")}')" onerror="this.style.background='#ddd'"><div style="flex:1"><b>${it.n}</b>${it.d?`<div class='desc'>${it.d.slice(0,60)}...</div>`:''}<div class="price">${it.p.toLocaleString()} Fcfa</div></div><button class="add" onclick="add('${it.n.replace(/'/g,"\\'")}',${it.p})">+ Ajouter</button></div>`;});});document.getElementById('menu').innerHTML=h;}render();
function add(n,p){let f=panier.find(x=>x.n==n);if(f)f.q++;else panier.push({n,p,q:1});maj();}
function maj(){let t=0,q=0,html='';panier.forEach(x=>{t+=x.p*x.q;q+=x.q;html+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eee"><span>${x.q}x ${x.n}</span><span>${(x.p*x.q).toLocaleString()}F <button onclick="ch('${x.n.replace(/'/g,"\\'")}',-1)" style="border:0;background:#eee;border-radius:6px;padding:2px 7px">-</button> <button onclick="ch('${x.n.replace(/'/g,"\\'")}',1)" style="border:0;background:#111;color:#fff;border-radius:6px;padding:2px 7px">+</button></span></div>`});document.getElementById('n').innerText=q;document.getElementById('totMini').innerText=t.toLocaleString()+' Fcfa';document.getElementById('totBtn').innerText=t?` - ${t.toLocaleString()}F`:'';document.getElementById('cartList').innerHTML=html||'Aucun article';}
function ch(n,d){let f=panier.find(x=>x.n==n);if(!f)return;f.q+=d;if(f.q<=0)panier=panier.filter(x=>x.n!=n);maj();}
function toggleCart(o){document.getElementById('cartFull').classList.toggle('open',o)}
function openPlat(nom){let all=DATA.flatMap(c=>c.items);let it=all.find(x=>x.n==nom);if(!it)return;document.getElementById('mImg').src=it.im;document.getElementById('mNom').innerText=it.n;document.getElementById('mDesc').innerText=it.d||'Délicieux plat fait maison';document.getElementById('mPrix').innerText=it.p.toLocaleString()+' Fcfa';document.getElementById('mAdd').onclick=()=>{add(it.n,it.p);closeModal();toggleCart(true);};document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function filtrer(){let v=document.getElementById('q').value.toLowerCase();document.querySelectorAll('.item').forEach(el=>{el.style.display=el.innerText.toLowerCase().includes(v)?'flex':'none'});}
function payer(){let total=panier.reduce((a,b)=>a+b.p*b.q,0);if(!total)return alert('Panier vide');let tel=document.getElementById('tel').value.trim();if(tel.length<8)return alert('Numéro MoMo manquant');let pay=document.querySelector('input[name="pay"]:checked').value;let num=pay=='Flooz'?FLOOZ:MIXX;let code=pay=='Flooz'?`*155*1*1*${num}*${total}#`:`*145*2*1*${num}*${total}#`;if(confirm(`Payer ${total}F vers ${num} (${pay}) ?`))location.href='tel:'+encodeURIComponent(code);}
function commanderWA(){let total=panier.reduce((a,b)=>a+b.p*b.q,0);if(!total)return alert('Panier vide');let tel=document.getElementById('tel').value.trim()||'Non';let nom=document.getElementById('clientNom').value.trim()||'Client';let pay=document.querySelector('input[name="pay"]:checked').value;let msg=`*COMMANDE COPACABANA*%0ARef:${REF}%0AClient:${nom}%0ATel:${tel}%0APaie:${pay}%0A`;panier.forEach(x=>msg+=`- ${x.q}x ${x.n} = ${(x.p*x.q).toLocaleString()}F%0A`);msg+=`%0A*TOTAL: ${total} Fcfa*`;window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');}
</script></body></html>
